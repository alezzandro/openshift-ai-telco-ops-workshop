# Default read-only toolsets from the Red Hat MCP catalog metadata.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshift-mcp-server-config
  namespace: telco-ops-demo
  labels:
    app: openshift-mcp-server
    workshop.opendatahub.io/component: mcp
data:
  config.toml: |
    log_level = 5
    port = "8080"
    read_only = true
    toolsets = ["core", "config"]
