# Red Hat build of OpenTelemetry — DSCI metrics stack deploys an
# OpenTelemetryCollector once spec.monitoring.metrics.storage is set.
# Traces / Tempo are not enabled (not required for Observe dashboards).
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-opentelemetry-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: opentelemetry-operator
  namespace: openshift-opentelemetry-operator
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: opentelemetry-product
  namespace: openshift-opentelemetry-operator
spec:
  channel: stable
  name: opentelemetry-product
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # Pin: Red Hat build of OpenTelemetry 0.158.0-202610151241 (2026-10-23).
  startingCSV: opentelemetry-operator.v0.158.0-202610151241
  installPlanApproval: Manual
