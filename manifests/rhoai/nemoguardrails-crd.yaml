# The Gen AI Studio Playground BFF lists NemoGuardrails on every chat POST.
# With TrustyAI Removed the API group is missing, and the BFF maps that
# discovery error to HTTP 500 ([http_500] in the chat UI). This CRD is only
# the list API so an empty list succeeds; it does not deploy guardrails.
# Skip applying it if TrustyAI later becomes Managed (operator owns the CRD).
# https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/experimenting_with_models_in_the_gen_ai_playground/index
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nemoguardrails.trustyai.opendatahub.io
  labels:
    app.kubernetes.io/part-of: telco-ops-workshop
    workshop.opendatahub.io/component: gen-ai-playground
spec:
  group: trustyai.opendatahub.io
  names:
    kind: NemoGuardrails
    listKind: NemoGuardrailsList
    plural: nemoguardrails
    singular: nemoguardrails
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
# Project admins inherit list via aggregated view/edit/admin (RHOAIENG-60940).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-nemoguardrails-viewer
  labels:
    app.kubernetes.io/part-of: telco-ops-workshop
    workshop.opendatahub.io/component: gen-ai-playground
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups:
      - trustyai.opendatahub.io
    resources:
      - nemoguardrails
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-nemoguardrails-gen-ai-ui
  labels:
    app.kubernetes.io/part-of: telco-ops-workshop
    workshop.opendatahub.io/component: gen-ai-playground
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-nemoguardrails-viewer
subjects:
  - kind: ServiceAccount
    name: odh-dashboard-gen-ai
    namespace: redhat-ods-applications
