apiVersion: v1
kind: ServiceAccount
metadata:
  name: clone-notebooks
  namespace: telco-ops-notebooks
  labels:
    app: cpu-langchain
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cpu-langchain
  namespace: telco-ops-notebooks
  labels:
    app: cpu-langchain
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workbench-clone-anyuid
subjects:
  - kind: ServiceAccount
    name: clone-notebooks
    namespace: telco-ops-notebooks
  - kind: ServiceAccount
    name: cpu-langchain
    namespace: telco-ops-notebooks
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:anyuid
  apiGroup: rbac.authorization.k8s.io
