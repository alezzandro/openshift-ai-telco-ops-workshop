apiVersion: v1
kind: Service
metadata:
  name: s4
  namespace: s4
  labels:
    app: s4
    workshop.opendatahub.io/component: s4
spec:
  type: ClusterIP
  selector:
    app: s4
  ports:
    - name: s3-api
      port: 7480
      targetPort: 7480
      protocol: TCP
    - name: web-ui
      port: 5000
      targetPort: 5000
      protocol: TCP
