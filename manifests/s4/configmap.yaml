apiVersion: v1
kind: ConfigMap
metadata:
  name: s4-config
  namespace: s4
  labels:
    app: s4
    workshop.opendatahub.io/component: s4
data:
  AWS_S3_ENDPOINT: "http://localhost:7480"
  AWS_DEFAULT_REGION: "us-east-1"
  MAX_CONCURRENT_TRANSFERS: "2"
  MAX_FILE_SIZE_GB: "50"
  PORT: "5000"
  IP: "0.0.0.0"
  JWT_EXPIRATION_HOURS: "8"
  COOKIE_REQUIRE_HTTPS: "true"
