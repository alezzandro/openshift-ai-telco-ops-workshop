# S4 (Ceph RGW in one container) needs anyuid, same class of demo exception
# as Open WebUI. Not a production object store.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s4
  namespace: s4
  labels:
    app: s4
    workshop.opendatahub.io/component: s4
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-s4-anyuid
  labels:
    app: s4
    workshop.opendatahub.io/component: s4
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: s4
    namespace: s4
