apiVersion: v1
kind: Namespace
metadata:
  name: telco-ran-ai
  labels:
    opendatahub.io/dashboard: "true"
    modelmesh-enabled: "false"
    kueue.openshift.io/managed: "true"
    workshop.opendatahub.io/tenant: "ran"
  annotations:
    openshift.io/display-name: "Telco RAN AI (playground)"
    openshift.io/description: "Playground tenant A — 5 GPU ResourceQuota (Kueue pool is 6 shared)"
