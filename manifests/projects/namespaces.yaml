# No kueue.openshift.io/managed label: the dashboard then shows Node-type
# HardwareProfiles (CPU only). Kueue serving projects hide those profiles.
apiVersion: v1
kind: Namespace
metadata:
  name: telco-ops-notebooks
  labels:
    opendatahub.io/dashboard: "true"
    modelmesh-enabled: "false"
    workshop.opendatahub.io/tenant: "notebooks"
  annotations:
    openshift.io/display-name: "Telco Ops Notebooks (CPU workbench)"
    openshift.io/description: "CPU-only Data Science Project for a Jupyter workbench. No Kueue LocalQueue, so it cannot steal L4 GPUs from serving."
