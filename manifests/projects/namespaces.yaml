apiVersion: v1
kind: Namespace
metadata:
  name: telco-core-ai
  labels:
    opendatahub.io/dashboard: "true"
    modelmesh-enabled: "false"
    kueue.openshift.io/managed: "true"
    workshop.opendatahub.io/tenant: "core"
  annotations:
    openshift.io/display-name: "Telco Core AI (playground)"
