    opendatahub.io/dashboard: "true"
    modelmesh-enabled: "false"
    kueue.openshift.io/managed: "true"
    workshop.opendatahub.io/tenant: "ops"
  annotations:
    openshift.io/display-name: "Telco Ops Demo (presenter)"
    openshift.io/description: "Presenter Data Science Project for the OpenShift AI ops workshop"
