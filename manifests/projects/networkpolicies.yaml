# Allow DNS, ingress controller, OpenShift AI dashboard, and Open WebUI into
# each Data Science Project. Default deny is not forced so KServe can still
# talk to the API; these policies are additive allow rules.
#
# Any Ingress NetworkPolicy that selects a pod isolates it. The predictor
# policies below therefore also need an allow for OpenShift user-workload
# Prometheus (label network.openshift.io/policy-group=monitoring) on the
# KServe metrics port, or Observe & monitor Deployed models stays "No data".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-open-webui-to-predictors
  namespace: telco-ops-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-webui
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
---
