        - namespaceSelector:
            matchLabels:
              opendatahub.io/dashboard: "true"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-applications
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opendatahub-ogx-system
---
apiVersion: networking.k8s.io/v1
