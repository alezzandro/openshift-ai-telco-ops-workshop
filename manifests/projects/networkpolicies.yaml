# Existing policies use podSelector: {} so they isolate every pod. Allow
# same-namespace OGX playground pods, other Data Science Projects, and the
# OpenShift AI / OGX operator namespaces to reach predictors and MCP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rhoai-playground
  namespace: telco-ops-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              opendatahub.io/dashboard: "true"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-applications
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opendatahub-ogx-system
---
apiVersion: networking.k8s.io/v1
