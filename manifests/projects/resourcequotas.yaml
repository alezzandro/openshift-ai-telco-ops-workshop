apiVersion: v1
kind: ResourceQuota
metadata:
  name: gpu-quota
  namespace: telco-ran-ai
spec:
  hard:
    requests.nvidia.com/gpu: "2"
    limits.nvidia.com/gpu: "2"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gpu-quota
  namespace: telco-core-ai
spec:
  hard:
    requests.nvidia.com/gpu: "2"
    limits.nvidia.com/gpu: "2"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cpu-quota
  namespace: telco-ops-notebooks
spec:
  hard:
    requests.cpu: "4"
    limits.cpu: "4"
    requests.memory: 16Gi
    limits.memory: 16Gi
    requests.nvidia.com/gpu: "0"
    limits.nvidia.com/gpu: "0"
