# Two ClusterQueues so a 4-GPU claim cannot land on a 2-L4 node.
# Git default is rehearsal: both queues share cohort workshop-gpu so student
# LocalQueue workshop borrows unused 4-L4 quota (2-L4 flavor quota is 0 here).
# setup/lib.sh sync_kueue_gpu_quotas *removes* the cohort on class day
# (2-L4 replicas > 0). Leaving the cohort lets gpu-pool-2l4 borrow presenter
# 4-L4 GPUs after 6 student cards fill; P5 then hits ResourceQuota, not Kueue.
# Presenter workshop LocalQueue points at gpu-pool-4l4.
# Kueue v1beta2 renamed spec.cohort → spec.cohortName; a v1beta2 object with
# spec.cohort is silently dropped and C3 stays SchedulingGated (quota 0).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu-pool-4l4
spec:
  namespaceSelector: {}
  cohortName: workshop-gpu
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - nvidia.com/gpu
      flavors:
        - name: l4-gpu-4
          resources:
            - name: cpu
              nominalQuota: "32"
            - name: memory
              nominalQuota: 128Gi
            - name: nvidia.com/gpu
              nominalQuota: "4"
  stopPolicy: None
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu-pool-2l4
spec:
  namespaceSelector: {}
  cohortName: workshop-gpu
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - nvidia.com/gpu
      flavors:
        - name: l4-gpu-4
          resources:
            - name: cpu
              nominalQuota: "32"
            - name: memory
              nominalQuota: 128Gi
            - name: nvidia.com/gpu
              nominalQuota: "0"
        - name: l4-gpu-2
          resources:
            - name: cpu
              nominalQuota: "64"
            - name: memory
              nominalQuota: 256Gi
            - name: nvidia.com/gpu
              nominalQuota: "0"
  stopPolicy: None
