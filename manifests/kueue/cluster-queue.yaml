# Two ClusterQueues so a 4-GPU claim cannot land on a 2-L4 node.
# Same cohort: during rehearsal, LocalQueue workshop borrows unused 4-L4 quota.
# Kueue v1beta2 renamed spec.cohort → spec.cohortName; a v1beta2 object with
# spec.cohort is silently dropped and C3 stays SchedulingGated (quota 0).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu-pool-4l4
spec:
  namespaceSelector: {}
  cohortName: workshop-gpu
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - nvidia.com/gpu
      flavors:
        - name: l4-gpu-4
          resources:
            - name: cpu
              nominalQuota: "32"
            - name: memory
              nominalQuota: 128Gi
            - name: nvidia.com/gpu
              nominalQuota: "4"
  stopPolicy: None
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu-pool-2l4
spec:
  namespaceSelector: {}
  cohortName: workshop-gpu
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - nvidia.com/gpu
      flavors:
        - name: l4-gpu-4
          resources:
            - name: cpu
              nominalQuota: "32"
            - name: memory
              nominalQuota: 128Gi
            - name: nvidia.com/gpu
              nominalQuota: "0"
        - name: l4-gpu-2
          resources:
            - name: cpu
              nominalQuota: "64"
            - name: memory
              nominalQuota: 256Gi
            - name: nvidia.com/gpu
              nominalQuota: "0"
  stopPolicy: None
